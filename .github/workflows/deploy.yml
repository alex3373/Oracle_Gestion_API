name: Deploy Oracle API

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check app.js
          node --check routes/oracleRoutes.js
          node --check db/connection.js

      - name: Create deployment package
        run: |
          tar -czf oracle-api-deploy.tar.gz \
            app.js \
            server.js \
            package.json \
            package-lock.json \
            routes \
            db

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.ORACLE_SSH_KEY_B64 }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$SSH_PRIVATE_KEY_B64" \
            | base64 --decode \
            > ~/.ssh/oracle.key

          chmod 600 ~/.ssh/oracle.key

          ssh-keygen -y \
            -f ~/.ssh/oracle.key \
            > /dev/null

          echo "SSH private key loaded successfully"

          ssh-keyscan -H "$ORACLE_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          scp \
            -i ~/.ssh/oracle.key \
            oracle-api-deploy.tar.gz \
            "$ORACLE_USER@$ORACLE_HOST:/tmp/oracle-api-deploy.tar.gz"

      - name: Deploy to Oracle Cloud
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh \
            -i ~/.ssh/oracle.key \
            "$ORACLE_USER@$ORACLE_HOST" \
            "export NODE_ENV='production'; \
             export DEMO_READ_ONLY='true'; \
             export CORS_ORIGINS='https://oracle.tramasys.cl,http://localhost:3000,http://localhost:3001,https://ventasgestion331.web.app,https://ventasgestion331.firebaseapp.com'; \
             deploy-oracle-api"